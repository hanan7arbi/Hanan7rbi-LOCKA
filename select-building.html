<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LOCKA - اختيار المبنى والدور</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app-screen">
    <div class="content">
        <!-- زر الرجوع  -->
        <div class="top-nav">
            <a href="home.html" class="back-btn">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                    <polyline points="12 5 19 12 12 19"></polyline>
                </svg>
            </a>
        </div>

        <div class="user-header" style="text-align: center; margin-bottom: 30px;">
            <h2>اختيار المبنى والدور</h2>
        </div>

        <form action="#" method="get">
            <div class="form-group">
                <label for="building">اختر المبنى:</label>
                <select id="building" name="building" required>
                    <option value="" disabled selected>إختر المبنى</option>
                    <option value="F2">مبنى F2 - كلية العلوم</option>
                    <option value="F3">مبنى F3 - كلية الإدارة و الاقتصاد</option>
                    <option value="F5">مبنى F5 - كلية الحاسب</option>
                    <option value="F6">مبنى F6 - كلية الشريعة</option>
                    <option value="F7">مبنى F7 - كلية الزراعة</option>
                    <option value="F8">مبنى F8 - كلية العمارة والتخطيط</option>
                </select>
            </div>

            <div class="form-group">
                <label for="floor">اختر الدور:</label>
                <select id="floor" name="floor" required>
                    <option value="" disabled selected>إختر الدور</option>
                    <option value="1">الدور الأول</option>
                    <option value="2">الدور الثاني</option>
                    <option value="3">الدور الثالث</option>
                </select>
            </div>

            <button type="submit" class="btn-submit">التالي </button>
        </form>
    </div>

        <!-- شريط التنقل السفلي -->
    <div class="nav-bar">
        <a href="home.html" class="nav-item active">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                <polyline points="9 22 9 12 15 12 15 22"></polyline>
            </svg>
            <span>الرئيسية</span>
        </a>
        <a href="#" class="nav-item">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                <line x1="16" y1="2" x2="16" y2="6"></line>
                <line x1="8" y1="2" x2="8" y2="6"></line>
                <line x1="3" y1="10" x2="21" y2="10"></line>
            </svg>
            <span>الحجوزات</span>
        </a>
        <a href="#" class="nav-item">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
                <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
            </svg>
            <span>التنبيهات</span>
        </a>
        <a href="#" class="nav-item">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                <circle cx="12" cy="7" r="4"></circle>
            </svg>
            <span>الملف الشخصي</span>
        </a>
    </div>


</div>

</body>
</html>
