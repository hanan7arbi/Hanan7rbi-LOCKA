<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LOCKA - الرئيسية</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app-screen">
    <div class="content">
        <!-- الترحيب -->
        <div class="user-header">
            <h2>مرحباً،  </h2>
        </div>

        <!-- شريط البحث -->
        <div class="search-box">
            <span>ابحث عن لوكر أو مبنى...</span>
        </div>

        <!-- الخيارات الرئيسية -->
        <div class="action-grid">
            <a href="select-building.html" class="action-card">
                <div class="icon-wrapper">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                    </svg>
                </div>
                <span>حجز لوكر</span>
            </a>
            <a href="#" class="action-card">
                <div class="icon-wrapper">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"></polygon>
                        <line x1="8" y1="2" x2="8" y2="18"></line>
                        <line x1="16" y1="6" x2="16" y2="22"></line>
                    </svg>
                </div>
                <span>عرض الخريطة</span>
            </a>
        </div>

        <!-- حجوزاتي القادمة -->
        <div class="section-title">حجوزاتي القادمة</div>
        <div class="booking-info-card">
            <div class="booking-details">
                <p><strong>المبنى:</strong> كلية الحاسب</p>
                <p><strong>اللوكر:</strong> 12</p>
                <p>من 10:00 ص إلى 12:00 م</p>
            </div>
            <div class="status-badge">نشط</div>
        </div>
    </div>

    <!-- شريط التنقل السفلي بالأيقونات -->
    <div class="nav-bar">
        <a href="home.html" class="nav-item active">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                <polyline points="9 22 9 12 15 12 15 22"></polyline>
            </svg>
            <span>الرئيسية</span>
        </a>
        <a href="#" class="nav-item">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                <line x1="16" y1="2" x2="16" y2="6"></line>
                <line x1="8" y1="2" x2="8" y2="6"></line>
                <line x1="3" y1="10" x2="21" y2="10"></line>
            </svg>
            <span>الحجوزات</span>
        </a>
        <a href="#" class="nav-item">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
                <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
            </svg>
            <span>التنبيهات</span>
        </a>
        <a href="#" class="nav-item">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                <circle cx="12" cy="7" r="4"></circle>
            </svg>
            <span>الملف الشخصي</span>
        </a>
    </div>
</div>

</body>
</html>
