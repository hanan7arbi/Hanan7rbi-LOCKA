<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LOCKA - الرئيسية</title>
    <link rel="stylesheet" href="style.css?v=20">
</head>
<body>

    <div class="app-container">
        <h1 class="welcome-title">مرحباً، سارة</h1>
        <p class="subtitle">ماذا تريدين أن تفعلي اليوم؟</p>

        <div class="search-container">
            <input type="text" class="search-bar" placeholder="ابحث عن لوكر أو مبنى...">
            <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="11" cy="11" r="8"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
        </div>

        <div class="grid-menu">
            <a href="select-building.html" class="card">
                <svg class="card-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                    <line x1="16" y1="2" x2="16" y2="6"></line>
                    <line x1="8" y1="2" x2="8" y2="6"></line>
                    <line x1="3" y1="10" x2="21" y2="10"></line>
                </svg>
                <span>حجز لوكر</span>
            </a>

            <a href="#" class="card">
                <svg class="card-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"></polygon>
                    <line x1="8" y1="2" x2="8" y2="18"></line>
                    <line x1="16" y1="6" x2="16" y2="22"></line>
                </svg>
                <span>عرض الخريطة</span>
            </a>
        </div>

        <section class="booking-section">
            <h2 class="section-title">حجوزاتي القادمة</h2>
            
            <div class="booking-card">
                <div class="booking-details">
                    <p><strong>المبنى:</strong> كلية الحاسب</p>
                    <p><strong>اللوكر:</strong> 12</p>
                    <p>من 10:00 ص إلى 12:00 م</p>
                    <p class="booking-date">2025/08/25</p>
                </div>
                <div class="booking-icon-box">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
                        <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
                    </svg>
                </div>
            </div>

            <a href="#" class="btn-view-all">عرض الكل</a>
        </section>
    </div>

</body>
</html>
