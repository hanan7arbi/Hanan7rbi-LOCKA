<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LOCKA</title>
    <style>
        :root {
            --primary-color: #0f2c59;
            --hover-color: #1b4985;
            --bg-color: #f8fafd;
            --card-bg: #ffffff;
            --text-color: #333333;
            --border-color: #e2e8f0;
            --active-green: #28a745;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            direction: rtl;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 40px 20px;
        }

        .app-container {
            width: 100%;
            max-width: 650px;
            background-color: var(--card-bg);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            border: 1px solid var(--border-color);
        }

        .welcome-title {
            color: var(--primary-color);
            font-size: 1.8rem;
            font-weight: bold;
            margin-bottom: 16px;
        }

        .search-bar {
            width: 100%;
            padding: 14px 18px;
            border: 1px solid var(--border-color);
            background-color: #f9fbfd;
            border-radius: 12px;
            margin-bottom: 24px;
            font-size: 0.95rem;
            outline: none;
        }

        .grid-menu {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-bottom: 30px;
        }

        .card {
            background-color: #f8fafd;
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 24px 16px;
            text-align: center;
            text-decoration: none;
            color: var(--primary-color);
            font-weight: bold;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            transition: transform 0.2s;
        }

        .card:hover {
            transform: translateY(-3px);
            border-color: var(--primary-color);
        }

        /* تحكم حاسم وأكيد بأحجام الأيقونات والصور داخل الكروت */
        .card img, .card svg {
            width: 42px !important;
            height: 42px !important;
            max-width: 42px !important;
            max-height: 42px !important;
            object-fit: contain;
        }

        .section-title {
            font-size: 1.2rem;
            color: var(--primary-color);
            margin-bottom: 14px;
            font-weight: bold;
        }

        .booking-card {
            background-color: #f8fafd;
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .booking-details p {
            font-size: 0.95rem;
            color: #555;
            margin-bottom: 6px;
        }

        .badge-active {
            background-color: #e6f4ea;
            color: var(--active-green);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: bold;
        }

        @media (max-width: 480px) {
            body {
                padding: 0;
            }
            .app-container {
                border-radius: 0;
                box-shadow: none;
                border: none;
                min-height: 100vh;
            }
        }
    </style>
</head>
<body>

    <div class="app-container">
        <h1 class="welcome-title">مرحباً،</h1>
        <input type="text" class="search-bar" placeholder="ابحث عن لوكر أو مبنى...">

        <div class="grid-menu">
            <a href="select-building.html" class="card">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                    <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                </svg>
                <span>حجز لوكر</span>
            </a>

            <a href="#" class="card">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"></polygon>
                    <line x1="8" y1="2" x2="8" y2="18"></line>
                    <line x1="16" y1="6" x2="16" y2="22"></line>
                </svg>
                <span>عرض الخريطة</span>
            </a>
        </div>

        <section class="booking-section">
            <h2 class="section-title">حجوزاتي القائمة</h2>
            <div class="booking-card">
                <div class="booking-details">
                    <p><strong>المبنى:</strong> كلية الحاسب</p>
                    <p><strong>اللوكر:</strong> 12</p>
                    <p><strong>الوقت:</strong> من 10:00 ص إلى 12:00 م</p>
                </div>
                <span class="badge-active">نشط</span>
            </div>
        </section>
    </div>

</body>
</html>
