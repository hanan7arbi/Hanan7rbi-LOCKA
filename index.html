<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="style.css?v=50">
</head>
<body>

   <div class="header-container">
    <div>
        <h1 class="welcome-title">مرحباً، </h1>
    </div>
    <img src="logo.png" alt="LOCKA Logo" class="app-logo">
</div>


        <div class="search-container">
            <input type="text" class="search-bar" placeholder="ابحث عن خزانة أو مبنى...">
            <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="11" cy="11" r="8"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
        </div>

        <div class="grid-menu">
            <a href="select-building.html" class="card">
                <svg class="card-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                    <line x1="16" y1="2" x2="16" y2="6"></line>
                    <line x1="8" y1="2" x2="8" y2="6"></line>
                    <line x1="3" y1="10" x2="21" y2="10"></line>
                </svg>
                <span>حجز خزانة</span>
            </a>

            <a href="#" class="card">
                <svg class="card-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"></polygon>
                    <line x1="8" y1="2" x2="8" y2="18"></line>

        </div>

        <section class="booking-section">
            <h2 class="section-title">حجوزاتي القادمة</h2>
            
            <div class="booking-card">
                <div class="booking-details">
                    <p><strong>المبنى:</strong> كلية العلمية بالرس</p>
                    <p><strong>الخزانة:</strong> 12</p>
                    <p>من 10:00 ص إلى 12:00 م</p>

                </div>
                
                <div class="booking-left">
                    <span class="badge-active">نشط</span>
                    
                        
                            
                        </svg>
                    </div>
                </div>
            </div>

        </section>
    </div>
<!-- القائمة الجانبية -->
<div id="sidebar" class="sidebar">
    <div class="sidebar-header">
        <h3>القائمة</h3>
        <button id="close-sidebar" class="close-btn">&times;</button>
    </div>
    <ul class="sidebar-menu">
        <li><a href="index.html" class="active"><span class="menu-icon">🏠</span> الرئيسية</a></li>
        <li><a href="#"><span class="menu-icon">🔐</span> حجوزاتي</a></li>
        <li><a href="#"><span class="menu-icon">🔔</span> التنبيهات</a></li>
        <li><a href="#"><span class="menu-icon">🎧</span> الدعم والمساعدة</a></li>
        <li><a href="#"><span class="menu-icon">👤</span> حسابي</a></li>
    </ul>
</div>

<!-- خلفية مظلمة عند فتح القائمة -->
<div id="overlay" class="overlay"></div>

<!-- كود تفعيل القائمة بالـ JS -->
<script>
    const menuBtn = document.querySelector('.menu-btn');
    const sidebar = document.getElementById('sidebar');
    const overlay = document.getElementById('overlay');
    const closeBtn = document.getElementById('close-sidebar');

    function openSidebar() {
        sidebar.classList.add('open');
        overlay.classList.add('show');
    }

    function closeSidebar() {
        sidebar.classList.remove('open');
        overlay.classList.remove('show');
    }

    if (menuBtn) menuBtn.addEventListener('click', openSidebar);
    if (closeBtn) closeBtn.addEventListener('click', closeSidebar);
    if (overlay) overlay.addEventListener('click', closeSidebar);
</script>

</body>
</html>
